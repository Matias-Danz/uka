name: UKA — aktualizovat akce a zveřejnit web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'admin_overrides.json'
      - 'media/**'
      - 'events.json'
      - 'price_links.json'
      - 'scripts/**'
      - '.github/workflows/update-events.yml'
      - 'requirements.txt'
      - 'availability_overrides.json'
      - 'price_overrides.json'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uka-publish
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Zkontrolovat povinné soubory
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Spouštím UKA ve složce: $PWD"
          for f in requirements.txt scripts/uka_sync.py events.json index.html; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Chybí povinný soubor: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Nainstalovat knihovny
        run: python -m pip install -r requirements.txt

      - name: Ověřit skript a data (bez internetu)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/uka_sync.py
          python -u scripts/uka_sync.py --check

      - name: Aktualizovat akce a ceny
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_INVENTORY_API_KEY: ${{ secrets.TICKETMASTER_INVENTORY_API_KEY }}
        run: |
          # Bez --dry-run: jinak se veřejně ověřené ceny z GoOutu neuloží.
          python -u scripts/uka_sync.py

      - name: Uložit změny do repozitáře
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- events.json
          if git diff --cached --quiet; then
            echo 'Žádné změny k uložení.'
          else
            git config user.name 'UKA Aktualizace'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'UKA: aktualizace akcí a cen'
            git push origin HEAD:main
          fi

      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Nahrát web
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Zveřejnit aktualizovaný web
        id: deployment
        uses: actions/deploy-pages@v4
