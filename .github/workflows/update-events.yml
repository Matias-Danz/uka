name: UKA — aktualizovat akce a zveřejnit web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'uka-auth.js'
      - 'uka-app.js'
      - 'uka-theme.js'
      - 'uka.css'
      - '_headers'
      - 'media/**'
      - 'events.json'
      - 'scripts/**'
      - '.github/workflows/update-events.yml'
      - 'requirements.txt'
      - 'admin_overrides.json'
      - 'availability_overrides.json'
      - 'price_overrides.json'
      - 'price_links.json'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uka-publish
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Zkontrolovat povinné soubory
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in requirements.txt scripts/uka_sync.py scripts/build_public.py events.json index.html; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Chybí povinný soubor: $f"
              exit 1
            fi
          done

      - name: Nainstalovat knihovny
        run: python -m pip install -r requirements.txt

      - name: Ověřit skript a data (bez internetu)
        run: |
          python -m py_compile scripts/uka_sync.py scripts/build_public.py
          python -u scripts/uka_sync.py --check

      - name: Testy před publikací
        run: python -m unittest discover -s tests -v

      - name: Aktualizovat akce a ceny
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_INVENTORY_API_KEY: ${{ secrets.TICKETMASTER_INVENTORY_API_KEY }}
        run: python -u scripts/uka_sync.py

      # Ticketmaster Chromium browser scraping is deliberately disabled after HTTP 403.
      # Use approved API access and other permitted public sources instead.

      - name: Uložit změny akcí do repozitáře
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- events.json
          if git diff --cached --quiet; then
            echo 'Žádné změny k uložení.'
          else
            git config user.name 'UKA Aktualizace'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'UKA: aktualizace akcí a cen'
            # Reconcile with concurrent owner/admin commits before pushing.
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo '::error::Conflict with a concurrent edit. Data were not force-pushed.'
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo '::error::Could not push after 3 attempts.'
                exit 1
              fi
            done
          fi

      - name: Připravit pouze veřejný web
        run: python scripts/build_public.py

      - name: Ověřit obsah publikace
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/events.json
          test ! -e dist/admin.html
          test ! -e dist/scripts
          test ! -e dist/tm_browser_state.json
          python - <<'PYTEST'
          import json
          data=json.load(open('dist/events.json',encoding='utf-8'))
          assert isinstance(data['events'],list)
          assert 'eventlook_cursor' not in data
          assert 'price_catalog_cache' not in data
          print('PUBLIC CHECK OK –',len(data['events']),'events')
          PYTEST

      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát veřejný web
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'

      - name: Zveřejnit aktualizovaný web
        id: deployment
        uses: actions/deploy-pages@v4
