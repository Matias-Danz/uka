name: UKA — aktualizovat akce a zveřejnit web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'events.json'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-events.yml'
  workflow_dispatch:
  schedule:
    # 13. minuta každé hodiny, čas UTC; GitHub může mít zpoždění.
    - cron: '13 * * * *'

# Soubor sám v GitHub Pages nezačne fungovat, dokud v Settings > Pages
# nenastavíš Source = GitHub Actions.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uka-publish
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout soubory projektu
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Zapnout Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nainstalovat knihovny
        run: python -m pip install -r requirements.txt
      - name: Aktualizovat akce (O2 + Ticketmaster)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/update_events.py
      - name: Uložit změny seznamu do GitHubu
        run: |
          if git diff --quiet -- events.json; then
            echo 'Seznam beze zmen.'
          else
            git config user.name 'UKA Aktualizace'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add events.json
            git commit -m 'UKA: automaticka aktualizace akci'
            git push origin HEAD:main
          fi
      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Nahrát web
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Zveřejnit aktualizovaný web
        id: deployment
        uses: actions/deploy-pages@v4
