name: UKA — kontrola a aktualizace akcí

on:
  push:
    branches: [Develop]
    paths:
      - 'index.html'
      - 'uka-auth.js'
      - 'uka-app.js'
      - 'uka-theme.js'
      - 'uka.css'
      - '_headers'
      - 'media/**'
      - 'events.json'
      - 'scripts/**'
      - 'tests/**'
      - 'admin-mode.html'
      - 'admin-mode.js'
      - 'admin-mode.css'
      - 'moderation.html'
      - 'moderation.js'
      - '.github/workflows/update-events.yml'
      - 'requirements.txt'
      - 'admin_overrides.json'
      - 'availability_overrides.json'
      - 'price_overrides.json'
      - 'price_links.json'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write

concurrency:
  group: uka-check-and-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v5
        with:
          ref: Develop
          persist-credentials: true

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Nastavit Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zkontrolovat povinné soubory
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in requirements.txt scripts/uka_sync.py scripts/build_public.py events.json index.html uka-app.js uka-auth.js; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Chybí povinný soubor: $f"
              exit 1
            fi
          done

      - name: Nainstalovat knihovny
        run: python -m pip install -r requirements.txt

      - name: Ověřit syntaxi
        run: |
          python -m py_compile scripts/*.py tests/*.py
          node --check uka-app.js
          node --check uka-auth.js
          node --check admin-mode.js
          node --check moderation.js
          node --check uka-theme.js

      - name: Ověřit data a testy
        run: |
          python -u scripts/uka_sync.py --check
          python scripts/validate_data.py
          python -m unittest discover -s tests -v

      - name: Aktualizovat akce a ceny
        if: github.event_name != 'push'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_INVENTORY_API_KEY: ${{ secrets.TICKETMASTER_INVENTORY_API_KEY }}
        run: python -u scripts/uka_sync.py

      - name: Ověřit data po aktualizaci
        if: github.event_name != 'push'
        run: |
          python scripts/validate_data.py
          python -m unittest discover -s tests -v

      - name: Ověřit veřejný build
        run: python scripts/build_public.py

      - name: Záloha JSON před uložením automatické aktualizace
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: uka-json-snapshot-${{ github.run_id }}
          path: |
            events.json
            admin_overrides.json
            availability_overrides.json
            price_overrides.json
            price_links.json
          retention-days: 30
          if-no-files-found: error

      - name: Uložit automatickou aktualizaci do Develop
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- events.json
          if git diff --cached --quiet; then
            echo 'Žádné změny k uložení.'
            exit 0
          fi
          git config user.name 'UKA Aktualizace'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UKA: aktualizace akcí a cen'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin Develop; then
              git rebase --abort || true
              echo '::error::Conflict with a concurrent edit. Data were not force-pushed.'
              exit 1
            fi
            if git push origin HEAD:Develop; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push after 3 attempts.'
              exit 1
            fi
          done
