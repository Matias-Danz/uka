name: UKA — aktualizovat akce a zveřejnit web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'events.json'
      - 'scripts/uka_sync.py'
      - '.github/workflows/update-events.yml'
      - 'media/**'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uka-publish
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout soubory
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Zapnout Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstalovat knihovny
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'

      - name: Aktualizovat UKA (Ticketmaster, O2, Eventlook, ceny)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_INVENTORY_API_KEY: ${{ secrets.TICKETMASTER_INVENTORY_API_KEY }}
        # --dry-run se týká jen experimentálního GoOut vyhledávání cen.
        # O2, Ticketmaster a Eventlook se zapisují do events.json.
        run: python scripts/uka_sync.py --dry-run

      - name: Uložit aktualizace do GitHubu
        run: |
          git add events.json
          if git diff --cached --quiet; then
            echo 'Žádné změny v databázi.'
          else
            git config user.name 'UKA Aktualizace'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'UKA: synchronizace dat'
            git push origin HEAD:main
          fi

      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Nahrát web
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Zveřejnit web
        id: deployment
        uses: actions/deploy-pages@v4
