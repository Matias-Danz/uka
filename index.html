  html[data-theme="dark"] .maplibregl-canvas{filter:brightness(1.24) contrast(.96) saturate(1.08)}
  .maplibregl-ctrl-group{background:var(--surface)!important;border:1px solid var(--stroke)!important;border-radius:11px!important;box-shadow:var(--shadow)!important;overflow:hidden}
  .maplibregl-ctrl-group button{background:var(--surface)!important;border-color:var(--stroke)!important}
  html[data-theme="dark"] .maplibregl-ctrl-icon{filter:invert(1)}
  .maplibregl-popup-content,.maplibregl-popup-tip{background:var(--surface);color:var(--text)}
  .maplibregl-popup-content{padding:15px 17px;border-radius:12px;font-family:inherit}
  .maplibregl-popup-content button{background:var(--gold);color:var(--gold-text);border:0;border-radius:8px;padding:8px 11px;margin-top:10px;font-size:12px;font-weight:800;cursor:pointer}
  .maplibregl-ctrl-attrib{background:var(--surface)!important;color:var(--muted)!important;font-size:10px!important}
  .maplibregl-ctrl-attrib a{color:var(--muted)!important}
  .uka-marker{width:29px;height:31px;cursor:pointer}
  .fallback-map{height:100%;min-height:220px;position:relative;display:flex;flex-direction:column;background:var(--tile-placeholder);overflow:hidden}
  .fallback-map>p{position:absolute;z-index:3;top:11px;left:12px;right:12px;background:var(--surface);border:1px solid var(--stroke);box-shadow:var(--shadow);padding:10px 12px;border-radius:11px;color:var(--text);font-size:12px;line-height:1.4;margin:0}
  .fallback-map .schematic{width:100%;height:100%;flex:1;min-height:210px;transition:transform .2s;transform-origin:center center}
  .fallback-map .schematic text{font-family:inherit;pointer-events:none}
  .fallback-map .fallback-actions{position:absolute;bottom:28px;left:12px;display:flex;gap:6px;z-index:3}
  .fallback-map .fallback-actions button{background:var(--surface);color:var(--text);border:1px solid var(--stroke);border-radius:9px;padding:7px 11px;font-size:18px;cursor:pointer}
  .fallback-map .fallback-badge{position:absolute;right:10px;bottom:7px;color:var(--muted);font-size:10px;background:var(--surface);padding:3px 6px;border-radius:4px}
  .fallback-map .fallback-dot{cursor:pointer;outline:none}
  .fallback-map .fallback-dot:hover .fallback-disc,.fallback-map .fallback-dot:focus .fallback-disc{stroke:var(--text);stroke-width:4}
  .map-trouble{position:absolute;bottom:26px;left:12px;z-index:4;background:var(--surface);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12px;max-width:65%;box-shadow:var(--shadow)}

  .uka-cluster {position:absolute}
  .uka-pin-count{position:absolute;left:24px;top:-12px;display:grid;place-items:center;min-width:23px;height:23px;padding:0 5px;border-radius:30px;background:var(--text);color:var(--bg);font-weight:900;font-size:11px;border:2px solid var(--bg);z-index:3}
  .uka-popup{display:grid;gap:8px;min-width:220px;max-height:260px;overflow:auto;color:#15171c}
  .uka-popup>strong{font-size:14px;padding-bottom:3px}
  .uka-popup-event{display:grid;gap:3px;text-align:left;width:100%;border:1px solid #dedee3;border-radius:10px;padding:9px 10px;background:#fff;color:#15171c;white-space:normal}
  .uka-popup-event:hover{border-color:#aa8410;background:#fff8de}
  .uka-popup-event b{font-size:12px}.uka-popup-event small{font-size:11px;color:#626775}
  
  .poster.has-image:before,.poster.has-image .poster-symbol{display:none}
  .poster-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1;display:block}
  .photo-credit{position:absolute;right:8px;bottom:8px;z-index:2;font-size:9px;color:#fff;padding:3px 6px;background:rgba(0,0,0,.58);border-radius:5px;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poster.has-image:after{display:block;content:'';position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(0deg,rgba(0,0,0,.13),transparent 55%);z-index:1;transform:none;right:0;top:0}
  .modal-art .poster-photo{object-position:center}
  .uka-popup-event{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left}
  .uka-popup-event small{font-size:10px;opacity:.7}
  </style>

  const STORE='uka-events-v1',FAVORITES='uka-favorites-v1'; // vlastní akce uživatele ponecháváme uložené
  function loadJson(key,def){try{const d=JSON.parse(localStorage.getItem(key));return Array.isArray(d)?d:def}catch{return def}}
  let added=loadJson(STORE,[]), favorites=new Set(loadJson(FAVORITES,[]));
  let page='akce',search='',category='',city='',when='all',favoriteOnly=false,mapCategory='',mapCity='',radius=0,userCoords=null;
  let mainMap=null,miniMap=null,mainTiles=null,miniTiles=null,mapMarkers=null,miniMarker=null,chosenCoords=null;
  let toastTimer=null;
  const el=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=p=>p===null||p===undefined||p===''?'Cena neuvedena':Number(p)===0?'Zdarma':`${Number(p).toLocaleString('cs-CZ')} Kč`;
  const priceLabel=e=>e.price==null?money(e.price):e.price_note?`${money(e.price)} · ${esc(e.price_note)}`:(e.price_from===true||(e.price_max!=null&&e.price_max>e.price))?`od ${money(e.price)}`:money(e.price);
  const eventSource=e=>e.source||'Vlastní událost';
  function fmtDate(d,mode='long'){const a=String(d).split('-').map(Number); const date=new Date(a[0],a[1]-1,a[2]);return Number.isNaN(date.getTime())?'Datum neuvedeno':date.toLocaleDateString('cs-CZ',mode==='long'?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'});}
  const dateParts=d=>{const p=fmtDate(d,'short').split(' ');return [p[0]?.replace('.','')||'',(p[1]||'').replace('.','').toUpperCase()]};
  let officialEvents=REAL_EVENTS;
  let liveSyncLabel='Předinstalovaný výběr · nové akce se aktualizují po zveřejnění webu';
  function getEvents(){const today=daysFromNow(0);return [...officialEvents,...added].filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));}
  async function refreshEvents(){
    // On file:// the embedded data are used; a standalone HTML cannot itself run an hourly crawler.
    if(location.protocol==='file:')return;
    try{
      const response=await fetch('./events.json?updated='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw new Error(String(response.status));
      const body=await response.json();
      if(!Array.isArray(body.events))throw new Error('Neplatná data');
      const validated=body.events.filter(e=>e&&e.id&&e.title&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.city&&e.venue);
      if(!validated.length)throw new Error('Prázdný feed');
      officialEvents=validated;
      liveSyncLabel=body.updated_at?'Aktualizováno: '+new Date(body.updated_at).toLocaleString('cs-CZ'):'Synchronizováno';
      if(page==='mapa'){renderMapListAndPins();}
      else if(page==='akce'||page==='oblibene')rerenderList();
      const status=el('syncStatus');if(status)status.textContent=liveSyncLabel;
    }catch(e){console.warn('UKA: live feed není k dispozici; použiji vloženou zálohu',e);}
  }
  function filterEvents({favoritesOnly=false,cat='',cityFilter='',query='',period='all',loc=null,maxRadius=0}={}){
    const now=daysFromNow(0);const dt=new Date();const end=new Date(dt.getFullYear(),dt.getMonth()+1,0);const monthEnd=`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;
    return getEvents().filter(e=>{
      if(e.date<now || (favoritesOnly&&!favorites.has(e.id)) || (cat&&e.category!==cat) || (cityFilter&&e.city!==cityFilter))return false;
      if(query&&!`${e.title} ${e.artist} ${e.venue} ${e.city} ${e.address||''}`.toLocaleLowerCase('cs').includes(query.toLocaleLowerCase('cs')))return false;
      if(period==='week'&&e.date>daysFromNow(7))return false;
      if(period==='month'&&e.date>monthEnd)return false;
      if(period==='free'&&(e.price==null||Number(e.price)!==0))return false;
      if(loc&&maxRadius>0&&distance(loc,[e.lat,e.lng])>maxRadius)return false;
      return true;
    });
  }
  const datePill=e=>{const [day,month]=dateParts(e.date);return `<div class="poster-date"><strong>${esc(day)}</strong><small>${esc(month)}</small></div>`};
  function eventPoster(e,modal=false){
    const letter=(e.title.match(/[\p{L}]/u)||['U'])[0].toUpperCase();
    const image=typeof e.image_url==='string'&&/^https:\/\//.test(e.image_url)?e.image_url:'';
    return `<div class="poster ${image?'has-image':''}" data-theme="${esc(e.category)}">${image?`<img class="poster-photo" src="${esc(image)}" alt="Plakát akce ${esc(e.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.querySelector('.photo-credit')?.remove();this.remove();this.parentElement.classList.remove('has-image')">`:''}<span class="poster-symbol">${esc(letter)}.</span>${modal?'':datePill(e)}${image&&e.image_credit?`<span class="photo-credit">${esc(e.image_credit)}</span>`:''}${modal?'':`<button class="favorite ${favorites.has(e.id)?'active':''}" data-fav="${esc(e.id)}" aria-label="${favorites.has(e.id)?'Odebrat z oblíbených':'Uložit do oblíbených'}" title="Oblíbené">${icon('heart')}</button>`}</div>`;
  }
  function card(e){return `<article class="event-card">${eventPoster(e)}<div class="card-body"><div class="card-top"><span class="category">${esc(CAT_LABELS[e.category]||'Akce')}</span><span class="card-price">${priceLabel(e)}</span></div><h3>${esc(e.title)}</h3><div class="card-line tiny">${icon('ticket','sm')} <span>${esc(eventSource(e))} ${e.verified_at?'· ověřeno '+fmtDate(e.verified_at):'· uložené lokálně'}</span></div><div class="card-line">${icon('music','sm')} <span>${esc(e.artist||'Účinkující neuvedeni')}</span></div><div class="card-line">${icon('pin','sm')} <span>${esc(e.venue)}, ${esc(e.city)}</span></div><div class="card-foot"><span>${fmtDate(e.date,'short')} · ${esc(e.time||'—')}</span><button class="text-link" data-detail="${esc(e.id)}">Detail ${icon('arrow','sm')}</button></div></div></article>`;}
  function pageHome(){const events=filterEvents({favoritesOnly:favoriteOnly,cat:category,cityFilter:city,query:search,period:when});return `
    ${favoriteOnly?'':`<section class="hero"><div class="container hero-wrap"><div><div class="eyebrow">✦ České hudební události na jednom místě</div><h1>Hudba.<br>Všude. <span>Teď.</span></h1><p class="hero-desc">Koncerty, ravy, festivaly nebo opera? Objev, co se děje kolem tebe. Kdo hraje, kde, kdy a za kolik — všechno přehledně na jednom místě.</p><div class="hero-actions"><button class="btn btn-primary" data-nav="mapa">${icon('pin')} Prozkoumat mapu ${icon('arrow')}</button><button class="btn btn-outline" data-jump="events">Prohlédnout akce</button></div><div class="hero-note"><span class="signal"></span> Bez registrace · Akce z GoOut, Eventlook a O2 arena</div></div><div class="art-panel" aria-label="Grafická hudební ilustrace"><span class="art-number">UKA / 001 — SOUND IS EVERYWHERE</span><div class="art-eq"><i></i><i></i><i></i><i></i><i></i></div><div class="art-caption"><b>YOUR CITY.<br>YOUR SOUND.</b><p>Najdi si svůj další zážitek.</p></div></div></div></section><div class="strip"><div class="container"><div class="strip-left">${icon('music')} <span><strong>Skutečné hudební akce.</strong> Akce z GoOutu, Eventlooku a O2 areny · rozšířeno 15. 10. 2026.</span></div><span class="strip-pill">BEZ BASE44 · ZDARMA</span></div></div>`}
    <section id="events" class="container section"><div class="section-head"><div><div class="eyebrow">${favoriteOnly?'TVŮJ VÝBĚR':'OBJEVUJ NOVOU HUDBU'}</div><h2>${favoriteOnly?'Uložené akce':'Kam vyrazíš příště?'}</h2><div id="syncStatus" class="muted tiny" style="margin:8px 0 0">${esc(liveSyncLabel)}</div><div class="section-sub">${favoriteOnly?'Akce, které sis označil srdíčkem.':'Koncerty a párty z veřejných programů · před cestou si ověř aktuální stav u pořadatele.'}</div></div><span class="muted tiny">Česko · ${getEvents().length} akcí v databázi</span></div>
    <div class="toolbar"><label class="field-wrap">${icon('search')}<input id="searchInput" autocomplete="off" placeholder="Interpret, akce, místo..." value="${esc(search)}" aria-label="Hledat akci"></label><select id="cityFilter" class="select" aria-label="Město"><option value="">Všechna města</option>${['Praha','Brno','Ostrava','Plzeň','Olomouc','Liberec','Pardubice'].map(c=>`<option value="${c}" ${city===c?'selected':''}>${c}</option>`).join('')}</select><select id="whenFilter" class="select" aria-label="Termín"><option value="all" ${when==='all'?'selected':''}>Kdykoliv</option><option value="week" ${when==='week'?'selected':''}>Do 7 dní</option><option value="month" ${when==='month'?'selected':''}>Tento měsíc</option><option value="free" ${when==='free'?'selected':''}>Vstup zdarma</option></select><button class="btn btn-outline btn-sm" id="clearFilters">Vymazat filtry</button></div>
    <div class="filter-pills">${CATS.map(([value,label])=>`<button class="pill ${category===value?'active':''}" data-category="${esc(value)}">${label}</button>`).join('')}</div><div class="results"><span>Našli jsme <b style="color:var(--text)">${events.length}</b> akcí</span><span>Seřazeno podle nejbližšího termínu</span></div>
    ${events.length?`<div id="eventCards" class="cards">${events.map(card).join('')}</div>`:`<div class="empty"><div class="empty-icon">♫</div><h3>Zatím tady nic není</h3><p>Vyzkoušej jiné filtry nebo přidej vlastní akci.</p><button class="btn btn-primary" data-nav="pridat">Přidat akci</button></div>`}</section>`;}

  function mapPage(){const list=mapEvents();return `<div class="container"><div class="page-top"><div><div class="eyebrow">AKCE VE TVÉM OKOLÍ</div><h1 class="page-title">Mapa hudebních akcí</h1><div class="section-sub">Barevná mapa ve dne, příjemně tmavá v noci. Přiblížení až do úrovně 22 · na jednom místě může být více akcí.</div></div><button class="btn btn-outline btn-sm" id="locateMe">${icon('locate')} Moje poloha</button></div><div class="map-layout"><div id="mainMap" class="map-box"><div class="map-loading">${icon('pin')} Načítám mapu…</div></div><aside class="map-side"><div class="map-tools"><h3>${list.length} akcí na mapě</h3><div class="muted tiny">Klikni na značku nebo na akci v seznamu. Číslo u značky = počet akcí na místě.</div><div class="map-selects"><select class="select" id="mapCity"><option value="">Všechna města</option>${['Praha','Brno','Ostrava','Plzeň','Olomouc','Liberec','Pardubice'].map(c=>`<option ${mapCity===c?'selected':''}>${c}</option>`).join('')}</select><select class="select" id="mapCat">${CATS.map(([v,l])=>`<option value="${v}" ${mapCategory===v?'selected':''}>${l}</option>`).join('')}</select></div>${userCoords?`<div class="radius-row"><button data-radius="0" class="pill ${radius===0?'active':''}">Vše</button>${[5,10,25,50,100].map(n=>`<button data-radius="${n}" class="pill ${radius===n?'active':''}">${n} km</button>`).join('')}</div>`:''}</div><div class="map-event-list">${list.length?list.map(e=>`<button class="map-event" data-focus="${esc(e.id)}"><span class="map-e-top"><span class="category">${esc(CAT_LABELS[e.category]||e.category)}</span><b>${priceLabel(e)}</b></span><strong>${esc(e.title)}</strong><small>${icon('pin','sm')} ${esc(e.city)} · ${fmtDate(e.date,'short')} · ${esc(e.time||'—')}${userCoords?' · '+Math.round(distance(userCoords,[e.lat,e.lng]))+' km':''}</small></button>`).join(''):'<div class="empty">Žádné akce ve výběru.</div>'}</div></aside></div></div>`;}
  function addPage(){return `<div class="form-shell"><div class="eyebrow">STAŇ SE SOUČÁSTÍ SCÉNY</div><h1>Přidat hudební akci</h1><p class="form-intro">Vyzkoušej formulář jako v opravdové UKA. Tvoje přidané akce se uloží <strong>jen do tvého prohlížeče</strong> a hned se zobrazí v seznamu i na mapě.</p><form id="eventForm">

  function showDetails(id){const e=getEvents().find(x=>x.id===id);if(!e)return;const fav=favorites.has(id),price=priceLabel(e);el('modalRoot').innerHTML=`<div class="overlay" role="presentation" data-close="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-art">${eventPoster(e,true)}<button class="modal-close" data-close="true" aria-label="Zavřít">${icon('cross')}</button></div><div class="modal-main"><div class="category">${esc(CAT_LABELS[e.category]||e.category)}</div><h2 id="detailTitle">${esc(e.title)}</h2><div class="muted">${esc(e.artist||'Interpret neuveden')}</div><div class="modal-info"><div class="info-item">${icon('calendar')}<div><small>Datum</small><b>${fmtDate(e.date)}</b></div></div><div class="info-item">${icon('clock')}<div><small>Začátek</small><b>${esc(e.time||'Čas neuveden')}</b></div></div><div class="info-item">${icon('pin')}<div><small>Místo</small><b>${esc(e.venue)}, ${esc(e.city)}${e.address?' · '+esc(e.address):''}</b></div></div><div class="info-item">${icon('ticket')}<div><small>Vstupné</small><b>${price}</b></div></div></div><p class="modal-desc">${esc(e.description||'U této akce zatím není k dispozici popis.')}</p><div class="muted tiny">Zdroj: ${esc(eventSource(e))}${e.verified_at?' · ověřeno '+fmtDate(e.verified_at):' · vlastní záznam'}. Údaje se mohou změnit; před nákupem je ověř u pořadatele.${e.price_max!=null?' Cenové rozpětí: '+money(e.price)+' – '+money(e.price_max):''}</div><div class="modal-actions">${e.ticket_url?`<a class="btn btn-primary" href="${esc(e.ticket_url)}" target="_blank" rel="noopener noreferrer">${icon('ticket')} Vstupenky / detail ${icon('arrow')}</a>`:`<button type="button" disabled class="btn btn-outline" title="Odkaz na vstupenky není dostupný">Odkaz na vstupenky není dostupný</button>`}<button class="btn btn-outline" data-fav="${esc(e.id)}">${icon('heart')} ${fav?'Odebrat z oblíbených':'Uložit akci'}</button><button class="btn btn-outline" data-map-event="${esc(e.id)}">${icon('pin')} Na mapě</button></div></div></div></div>`;document.body.style.overflow='hidden';}
  function closeModal(clear=true){if(clear){el('modalRoot').innerHTML='';document.body.style.overflow='';}else{el('modalRoot').innerHTML='';document.body.style.overflow='';}}
  function distance(a,b){let toR=x=>x*Math.PI/180,dl=toR(b[0]-a[0]),dn=toR(b[1]-a[1]);let v=Math.sin(dl/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dn/2)**2;return 6371*2*Math.atan2(Math.sqrt(v),Math.sqrt(1-v));}
  function pinNode(user=false){

  let mainMapTimer=null,miniMapTimer=null,offlineZoom=1;

  function showFallbackMap(id,form=false){
    const target=el(id);if(!target)return;
    const positions={Praha:[50.0871,14.4211],Brno:[49.1951,16.6068],Ostrava:[49.8209,18.2625],Plzeň:[49.7475,13.3776],Olomouc:[49.5938,17.2509],Liberec:[50.769,15.0588],Pardubice:[50.0343,15.7812]};

    const cities=Object.entries(positions).map(([label,[la,lo]])=>{const [x,y]=project(la,lo);return `<g><circle cx="${x}" cy="${y}" r="5" fill="var(--muted)"/><text x="${x+12}" y="${y-8}" font-size="16" font-weight="700" fill="var(--text)">${esc(label)}</text></g>`}).join('');

      return `<g class="fallback-dot" data-detail="${esc(ev.id)}" tabindex="0" role="button" aria-label="Detail: ${esc(ev.title)}"><circle class="fallback-disc" cx="${x}" cy="${y}" r="10" stroke="var(--bg)" stroke-width="3" fill="var(--gold)"/><circle cx="${x}" cy="${y}" r="2.5" fill="var(--bg)"/></g>`;
    }).join('');

    offlineZoom=1;
  }
  function initMainMap(){
    const target=el('mainMap');if(!target)return;
    if(typeof maplibregl==='undefined'){showFallbackMap('mainMap');return;}
    target.innerHTML='';
    try{
      mainMap=new maplibregl.Map({container:target,style:mapStyle(),center:userCoords?[userCoords[1],userCoords[0]]:[15.45,49.9],zoom:userCoords?11:7,maxZoom:22,minZoom:4,attributionControl:false});

      mainMapTimer=setTimeout(()=>{if(mainMap&& !mainMap.loaded()){mainMap.remove();mainMap=null;mapMarkers=[];showFallbackMap('mainMap');}},12000);

  function renderMapListAndPins(updateHtml=true){
    if(page!=='mapa')return;
    const visible=mapEvents();
    if(updateHtml){
      const temp=document.createElement('div');temp.innerHTML=mapPage();
      const newSide=temp.querySelector('.map-side'),oldSide=document.querySelector('.map-side');
      if(newSide&&oldSide)oldSide.replaceWith(newSide);
    }
    if(!mainMap){if(el('mainMap')?.querySelector('.fallback-map'))showFallbackMap('mainMap');return;}
    (mapMarkers||[]).forEach(m=>m.remove());mapMarkers=[];
    // Jedna značka pro stejné místo. Kliknutí nabídne všechny koncerty v daném klubu.
    const byVenue=new Map();
    for(const ev of visible){
      if(!Number.isFinite(Number(ev.lat))||!Number.isFinite(Number(ev.lng)))continue;
      const key=[Number(ev.lat).toFixed(5),Number(ev.lng).toFixed(5)].join(',');
      if(!byVenue.has(key))byVenue.set(key,[]);
      byVenue.get(key).push(ev);
    }
    byVenue.forEach(group=>{
      const ev=group[0];
      const markerEl=pinNode();
      if(group.length>1){
        markerEl.classList.add('uka-cluster');
        const count=document.createElement('span');count.className='uka-pin-count';count.textContent=String(group.length);markerEl.append(count);
      }
      const items=group.map(item=>`<button type="button" class="uka-popup-event" data-detail="${esc(item.id)}"><b>${esc(item.title)}</b><small>${fmtDate(item.date,'short')} · ${esc(item.time||'—')} · ${priceLabel(item)}</small></button>`).join('');

      const marker=new maplibregl.Marker({element:markerEl}).setLngLat([Number(ev.lng),Number(ev.lat)]).setPopup(new maplibregl.Popup({offset:23,maxWidth:'300px'}).setHTML(popup)).addTo(mainMap);
      marker.ukaEventIds=group.map(item=>item.id);
      mapMarkers.push(marker);
    });
    if(userCoords){mapMarkers.push(new maplibregl.Marker({element:pinNode(true)}).setLngLat([userCoords[1],userCoords[0]]).setPopup(new maplibregl.Popup().setText('Tvoje poloha')).addTo(mainMap));}
  }
  function focusMapEvent(id){

  function locate(){

  function submitEvent(){const f=id=>el(id)?.value?.trim()||'';const title=f('eTitle'),venue=f('eVenue'),cityInput=f('eCity'),date=f('eDate');if(!title||!venue||!cityInput||!date||date<daysFromNow(0)){showToast('Vyplň název, místo, město a budoucí datum.');return;}let url=f('eTicket');if(url){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();}catch{showToast('Odkaz na vstupenky musí začínat https:// nebo http://');return;}}const key=cityInput.replaceAll(' ','_');const pos=chosenCoords||CITIES[key]||CITIES.Praha;const priceVal=f('ePrice');const e={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),title,artist:f('eArtist'),category:f('eCat'),venue,city:cityInput,date,time:f('eTime'),price:priceVal===''?null:Number(priceVal),ticket_url:url,description:f('eDesc'),lat:pos[0],lng:pos[1]};added.push(e);try{localStorage.setItem(STORE,JSON.stringify(added))}catch{showToast('Prohlížeč nepovoluje lokální úložiště; akce bude jen dočasná.')}category='';city='';when='all';search='';showToast('Akce přidána! Najdeš ji v přehledu i na mapě.');go('akce');}
  document.addEventListener('click',e=>{
    const oz=e.target.closest('[data-offline-zoom]');if(oz){offlineZoom=Math.max(1,Math.min(5,offlineZoom-Number(oz.dataset.offlineZoom)*.45));const svg=oz.closest('.fallback-map')?.querySelector('.schematic');if(svg)svg.style.transform=`scale(${offlineZoom})`;return;}

    const d=e.target.closest('[data-detail]');if(d){showDetails(d.dataset.detail);return;}
    const close=e.target.closest('[data-close]');if(close&&(e.target===close||e.target.closest('button[data-close]'))){closeModal();return;}
    const jump=e.target.closest('[data-jump]');if(jump){el(jump.dataset.jump)?.scrollIntoView({behavior:'smooth'});return;}
    if(e.target.closest('#clearFilters')){search='';city='';when='all';category='';rerenderList();return;}
    if(e.target.closest('#locateMe')){locate();return;}
    const r=e.target.closest('[data-radius]');if(r){radius=Number(r.dataset.radius);renderMapListAndPins();return;}
    const focus=e.target.closest('[data-focus]');if(focus){focusMapEvent(focus.dataset.focus);return;}
    const mapEvent=e.target.closest('[data-map-event]');if(mapEvent){const id=mapEvent.dataset.mapEvent;closeModal();mapCategory='';mapCity='';radius=0;go('mapa');setTimeout(()=>focusMapEvent(id),450);return;}
  });
  document.addEventListener('input',e=>{if(e.target.id==='searchInput'){search=e.target.value;const list=filterEvents({favoritesOnly:favoriteOnly,cat:category,cityFilter:city,query:search,period:when});const cards=el('eventCards');const section=cards?.parentElement;if(cards){cards.innerHTML=list.map(card).join('');const rs=document.querySelector('.results span');if(rs)rs.innerHTML=`Našli jsme <b style="color:var(--text)">${list.length}</b> akcí`;cards.style.display=list.length?'grid':'none';if(!list.length&&section&&!el('searchEmpty')){cards.insertAdjacentHTML('afterend','<p id="searchEmpty" class="empty">Nic jsme nenašli. Zkus jiné hledání.</p>')}else if(list.length)el('searchEmpty')?.remove();}else rerenderList();}});
  document.addEventListener('change',e=>{if(e.target.id==='cityFilter'){city=e.target.value;rerenderList()}if(e.target.id==='whenFilter'){when=e.target.value;rerenderList()}if(e.target.id==='mapCity'){mapCity=e.target.value;renderMapListAndPins()}if(e.target.id==='mapCat'){mapCategory=e.target.value;renderMapListAndPins()}if(e.target.id==='eCity')updateFormCity();});
  document.addEventListener('submit',e=>{if(e.target.id==='eventForm'){e.preventDefault();submitEvent();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fallback-dot[data-detail]')){e.preventDefault();showDetails(e.target.dataset.detail);}});
  el('themeToggle').addEventListener('click',()=>setTheme(theme()==='dark'?'light':'dark'));
  window.addEventListener('hashchange',render);
  syncThemeButton();render();refreshEvents();
  // Refresh the published JSON while tab stays open, independently of background crawler.
  setInterval(refreshEvents,15*60*1000);
  </script>
</body>
</html>
